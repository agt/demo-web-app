<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Lab Equipment Checkout</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-flask"></i>
        <h1>Lab Equipment Checkout</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="login-error" class="alert alert-danger" style="display:none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span></span>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" class="form-control"
                 placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control"
                 placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">
          <span id="btn-spinner" class="fa-solid fa-spinner fa-spin" style="display:none;"></span>
          <span id="btn-text">Sign in</span>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
