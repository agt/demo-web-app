<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Lab Equipment Checkout</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <i class="fa-solid fa-flask"></i>
      <span>Lab Equipment</span>
    </div>
    <div class="navbar-links">
      <a href="/dashboard.html"><i class="fa-solid fa-table-cells"></i> Equipment</a>
      <a href="/admin.html" id="admin-link" style="display:none"><i class="fa-solid fa-gear"></i> Admin</a>
    </div>
    <div class="navbar-right">
      <span class="username" id="nav-username"></span>
      <span class="role-badge" id="nav-role"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </button>
    </div>
  </nav>

  <main class="page-container">

    <!-- Equipment Catalog -->
    <section class="section">
      <div class="section-header">
        <h2><i class="fa-solid fa-microscope" style="color:var(--primary);margin-right:.4rem;"></i>Equipment Catalog</h2>
      </div>
      <div id="equipment-grid" class="equipment-grid">
        <div class="spinner"></div>
      </div>
    </section>

    <!-- My Active Checkouts -->
    <section class="section">
      <div class="section-header">
        <h2><i class="fa-solid fa-list-check" style="color:var(--primary);margin-right:.4rem;"></i>My Active Checkouts</h2>
      </div>
      <div class="card">
        <div class="card-body" id="active-checkouts">
          <div class="spinner"></div>
        </div>
      </div>
    </section>

    <!-- Checkout History -->
    <section class="section">
      <div class="section-header">
        <h2><i class="fa-solid fa-clock-rotate-left" style="color:var(--gray-400);margin-right:.4rem;"></i>My History</h2>
      </div>
      <div class="card">
        <div class="card-body" id="checkout-history">
          <div class="spinner"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="modal-backdrop" style="display:none;" onclick="if(event.target===this)closeCheckoutModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 id="checkout-modal-title">Check Out Equipment</h3>
        <button class="modal-close" onclick="closeCheckoutModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="checkout-error" class="alert alert-danger" style="display:none;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span></span>
        </div>
        <div class="form-group">
          <label for="checkout-notes">Notes (optional)</label>
          <textarea id="checkout-notes" class="form-control" rows="3"
                    placeholder="e.g. Project name, expected use…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeCheckoutModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitCheckout()">
          <i class="fa-solid fa-right-from-bracket"></i> Confirm Checkout
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
