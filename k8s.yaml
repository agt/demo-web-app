# Lab Equipment Checkout — Kubernetes manifests
#
# Bundled: Deployment + ClusterIP Service
#
# BEFORE APPLYING:
#   1. Replace JWT_SECRET_KEY value with output of: openssl rand -hex 32
#   2. Replace image name/tag to match your registry, e.g.:
#        ghcr.io/your-org/lab-checkout:1.0.0
#
# Apply:   kubectl apply -f k8s.yaml
# Seed DB: kubectl exec deploy/lab-checkout -- python seed.py
# Remove:  kubectl delete -f k8s.yaml
#
# NOTE — emptyDir storage is ephemeral: the database is lost whenever the
# pod is replaced (restart, rescheduling, node drain).  For persistent
# storage replace the emptyDir volume with a PersistentVolumeClaim.
# Similarly, storing JWT_SECRET_KEY directly in the pod template exposes
# it in plaintext YAML; migrate to a Secret for production use.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-checkout
  labels:
    app: lab-checkout
spec:
  # SQLite does not support concurrent writes; keep replicas at 1.
  replicas: 1
  selector:
    matchLabels:
      app: lab-checkout
  template:
    metadata:
      labels:
        app: lab-checkout
    spec:
      containers:
        - name: lab-checkout
          image: lab-checkout:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: JWT_SECRET_KEY
              value: "REPLACE_WITH_OUTPUT_OF_openssl_rand_hex_32"
            - name: SQLITE_DB_PATH
              value: /data/lab.db
          volumeMounts:
            - name: db-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /login.html
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # uvicorn writes .secret_key if not set via env
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: lab-checkout
  labels:
    app: lab-checkout
spec:
  selector:
    app: lab-checkout
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
